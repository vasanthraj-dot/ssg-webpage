
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK NOW</title>
    <link rel="icon" href="./logo.jpg">

    <style>
        body {
            color: black;
            text-align: center;
            background-image: url("./fly-on-road-book-now-bg-4k.jpg");
            background-size: cover;
            background-position: left;
            background-attachment: fixed;
            font-family: Arial;
        }
        form {
    width: 450px;
    max-width: 90%;
    margin: auto;
    padding: 25px;
    background-color: white;
    text-align: left;
    }
    input, textarea {
    margin-left: 10px;
    margin-bottom: 10px;}

        form {
            width: 450px;
            max-width: 90%;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        input, textarea {
            padding: 7px;
        }

        h1 {
            color: yellowgreen;
        }
    </style>
</head>

<body>

    <h1>BOOK NOW</h1>

    <form style="min-height: 75vh;">

        Name:
        <input type="text" placeholder="Enter your first name" required>
        <input type="text" placeholder="Last name">
        <br><br>

        Father's Name:
        <input type="text" placeholder="Enter your father's name">
        <br><br>

        Date of birth:
        <input type="date">
        <br><br>

        Mobile no:
        <input type="tel" placeholder="Enter your number">
        <br><br>

        Email id:
        <input type="email" placeholder="Enter your email">
        <br><br>

        Gender:
        <input type="radio" name="Gender" value="Male"> Male
        <input type="radio" name="Gender" value="Female"> Female
        <br><br>

        Nationality:
        <input type="radio" name="Nationality" value="India"> India
        <input type="radio" name="Nationality" value="Sri Lanka"> Sri Lanka
        <input type="radio" name="Nationality" value="US"> US
        <input type="radio" name="Nationality" value="UK"> UK
        <input type="radio" name="Nationality" value="Others"> Others
        <br><br>

        PHOTO:
        <input type="file" accept="image/*">
        <br><br>

        City:
        <input type="text" placeholder="Enter your city">
        <br><br>

        Address:
        <br>
        <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
        <br><br>

        No. of Travelers:
        <input type="number" min="1" placeholder="Enter the number">
        <br><br>

        <input type="submit" value="BOOK NOW">
        <input type="reset" value="RESET">

    </form>

    <hr color="black">

    <div style="text-align: center; color: greenyellow;">
        FOR MORE INFORMATION CONTACT THE GIVEN PERSON
        <br><br>
        Contact Number: 987654321
        <br><br>
        Email id: flyonroad@gmail.com
    </div>

</body>
</html>
